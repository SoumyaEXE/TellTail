# ---------------------------------------------------------------------------
# Packages for Streamlit in Snowflake.
#
# THIS FILE MUST SHIP TO THE STAGE NEXT TO streamlit_app.py. Without it, plotly
# raises ModuleNotFoundError in SiS only — it imports fine locally, which is a
# genuinely confusing hour of your life.
#
# scripts/deploy_streamlit.py PUTs both files together and refuses to deploy the
# app without this one.
# ---------------------------------------------------------------------------
name: sf_env
channels:
  - snowflake
dependencies:
  - python=3.11
  - plotly
  - pandas
  - numpy
